name: cindr CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build production JavaScript
        run: npm run build

      - name: Lint browser & tooling JavaScript
        run: npm run lint:js

      - name: Run CashVM & HTTP API test suite
        run: npm run verify

      - name: Run smoke flow check
        run: npm run smoke

      - name: Run plain-English copy check
        run: npm run check:words
